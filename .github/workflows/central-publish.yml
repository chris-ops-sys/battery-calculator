name: Publish to Maven Central
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup GPG and Publish
        run: |
          sudo apt-get update && sudo apt-get install -y gnupg zip
          gpg --batch --passphrase '' --quick-gen-key "LiTrue <asozulujidef01@gmail.com>" default default never
          KEY_ID=$(gpg --list-keys --with-colons asozulujidef01@gmail.com | awk -F: '/^fpr:/ {print $10; exit}')
          gpg --keyserver keyserver.ubuntu.com --send-keys "$KEY_ID"
          mkdir -p bundle/io/github/chris-ops-sys/litrue-battery-specs/1.0.0
          cd bundle/io/github/chris-ops-sys/litrue-battery-specs/1.0.0
          cp ../../../../../pom.xml litrue-battery-specs-1.0.0.pom
          zip litrue-battery-specs-1.0.0.jar ../../../../../README.md
          zip litrue-battery-specs-1.0.0-sources.jar ../../../../../README.md
          zip litrue-battery-specs-1.0.0-javadoc.jar ../../../../../README.md
          for f in *; do
            gpg --batch --yes --pinentry-mode loopback --passphrase '' -ab "$f"
          done
          for f in *; do
            sha1sum "$f" | cut -d' ' -f1 > "${f}.sha1"
            md5sum "$f" | cut -d' ' -f1 > "${f}.md5"
          done
          cd ../../../../..
          cd bundle && zip -r ../bundle.zip . && cd ..
          curl -v -X POST "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC" \
            -H "Authorization: Bearer ${{ secrets.OSSRH_TOKEN }}" \
            -F "bundle=@bundle.zip"
