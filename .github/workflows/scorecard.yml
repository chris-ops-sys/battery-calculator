name: OpenSSF Scorecard

on:
  schedule:
    - cron: '30 1 * * 1'
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Install Scorecard CLI"
        run: |
          wget -q https://github.com/ossf/scorecard/releases/download/v5.0.0/scorecard_5.0.0_linux_amd64.tar.gz
          tar -xzf scorecard_5.0.0_linux_amd64.tar.gz
          sudo mv scorecard /usr/local/bin/

      - name: "Run Scorecard Analysis"
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scorecard --repo=github.com/${{ github.repository }} --format=sarif > results.sarif || true

      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
