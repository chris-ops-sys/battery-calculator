name: OpenSSF Scorecard Status Check

on:
  schedule:
    - cron: '30 1 * * 1'
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  check-scorecard:
    runs-on: ubuntu-latest
    steps:
      - name: Ping OpenSSF Scorecard Public API
        run: |
          echo "Checking OpenSSF Scorecard index status for chris-ops-sys/battery-calculator..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" "https://api.scorecard.dev/projects/github.com/chris-ops-sys/battery-calculator")
          echo "API Response HTTP Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Project is actively indexed in OpenSSF Scorecard registry!"
            cat response.json
          else
            echo "Project request dispatched. OpenSSF public crawler will process this repository asynchronously."
          fi
